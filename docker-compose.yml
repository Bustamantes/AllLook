services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alllook_web
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./static:/app/static
      - ./app:/app/app
    environment:
      - PORT=8080
      - DATABASE_PATH=/app/data/alllook.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
